name: Data Pipeline

on:
  schedule:
    # Source cadence: the Digital Atlas republishes the Historical Bushfire
    # Boundaries irregularly, roughly annually, and the 2020-25 Extents layer
    # annually. Quarterly is the smallest cadence proportional to that, and is
    # timed so a refresh is always picked up before the southern fire season.
    # Staggered to day 9 at 04:23 so this repo does not fire with the others.
    #
    # The live "Burning now" view is NOT served from here. It polls public
    # CORS-open feeds directly in the browser — no Action ever touches it.
    - cron: '23 4 9 2,5,8,11 *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `npm install`, never `npm ci` — mapshaper's optional native dependencies
      # make `ci` fail on a clean runner while installing fine locally.
      - run: cd pipeline && npm install
      - run: node --max-old-space-size=6144 pipeline/collect.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push)
